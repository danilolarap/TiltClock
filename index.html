<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiltClock 3D - Smartwatch Watchface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen font-mono select-none p-4">

    <!-- Contenedor / Simulación del Smartwatch -->
    <div class="relative flex flex-col items-center">
        <!-- Correa Superior -->
        <div class="w-28 h-16 bg-gradient-to-b from-slate-300 to-slate-200 rounded-t-2xl border-t border-x border-slate-300/60 shadow-inner flex justify-center pt-2">
            <div class="w-12 h-1 bg-slate-300 rounded-full"></div>
        </div>

        <!-- Bisel / Cuerpo del Reloj (Circular) -->
        <div class="relative w-[340px] h-[340px] sm:w-[380px] sm:h-[380px] bg-gradient-to-br from-slate-100 via-slate-200 to-slate-300 rounded-full p-4 shadow-2xl border-4 border-slate-200/80 flex items-center justify-center">
            
            <!-- Botón Lateral Corona -->
            <div class="absolute -right-3 top-1/2 -translate-y-1/2 w-3 h-10 bg-slate-300 rounded-r border border-slate-400/50 shadow"></div>
            <div class="absolute -right-2 top-1/3 w-2 h-6 bg-slate-300 rounded-r border border-slate-400/50 shadow"></div>

            <!-- Pantalla Circular (Watchface) -->
            <div class="relative w-full h-full bg-slate-50 rounded-full overflow-hidden border border-slate-200 shadow-inner flex flex-col items-center justify-between p-5 text-cyan-600">
                
                <!-- Header: Fecha y Pasos -->
                <div class="z-10 flex flex-col items-center gap-0.5 mt-1">
                    <div class="flex items-center gap-2 text-[10px] text-slate-500 font-medium">
                        <span><i class="fa-regular fa-calendar text-cyan-500 mr-1"></i><span id="watch-date">LUN, 24 OCT</span></span>
                        <span>•</span>
                        <span><i class="fa-solid fa-person-walking text-cyan-500 mr-1"></i><span id="watch-steps">7,420</span> PASOS</span>
                    </div>

                    <!-- Hora Digital Eleva y Reposicionada -->
                    <div class="text-3xl sm:text-4xl font-black tracking-tight text-slate-900 mt-1 flex items-baseline gap-1">
                        <span id="watch-time">07:46</span>
                        <span id="watch-ampm" class="text-xs font-bold text-cyan-600">AM</span>
                    </div>
                </div>

                <!-- Centro: Lienzo 3D para el Avatar (Limpio y sin solapamientos) -->
                <div class="relative flex-1 w-full flex items-center justify-center my-1">
                    <div id="avatar-canvas-container" class="absolute inset-0 w-full h-full flex items-center justify-center"></div>
                </div>

                <!-- Footer: Batería y Botón Cargar Avatar -->
                <div class="z-10 flex flex-col items-center gap-2 w-full mb-1">
                    <div class="flex items-center justify-center w-full text-[10px] text-slate-500 font-semibold">
                        <span><i class="fa-solid fa-battery-three-quarters text-emerald-500 mr-1"></i><span id="watch-battery">85%</span> BATERÍA</span>
                    </div>

                    <!-- Botón Cargar Avatar GLB -->
                    <label class="bg-cyan-500 hover:bg-cyan-600 active:scale-95 text-white font-bold text-[11px] px-4 py-1.5 rounded-full shadow-md cursor-pointer transition flex items-center gap-1.5">
                        <i class="fa-solid fa-box-archive text-xs"></i>
                        <span>Cargar Avatar .GLB</span>
                        <input type="file" id="glb-input" accept=".glb,.gltf" class="hidden">
                    </label>
                </div>

            </div>
        </div>

        <!-- Correa Inferior -->
        <div class="w-28 h-16 bg-gradient-to-t from-slate-300 to-slate-200 rounded-b-2xl border-b border-x border-slate-300/60 shadow-inner flex justify-center pb-2">
            <div class="w-12 h-1 bg-slate-300 rounded-full self-end"></div>
        </div>
    </div>

    <!-- Carga de Librerías 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <!-- Módulos de la Aplicación -->
    <script src="js/gyroscope.js"></script>
    <script src="js/avatar3d.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
