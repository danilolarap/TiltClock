<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiltClock 3D - Smartwatch Watchface</title>
    
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Externos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col items-center justify-center min-h-screen font-sans select-none p-4 gap-6 transition-colors duration-300 overflow-x-hidden">

    <!-- Barra de Controles -->
    <header class="control-bar-box bg-white/80 backdrop-blur-md px-4 py-2 rounded-2xl shadow-sm border border-slate-200/80 flex flex-wrap items-center justify-center gap-3 z-30 transition-colors duration-300">
        
        <!-- Selector modelos -->
        <div class="flex items-center gap-2">
            <span id="model-label" class="text-xs font-bold text-slate-500 uppercase tracking-wider mr-1 font-clean">Modelo:</span>
            <button data-device-target="circular" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-cyan-500 text-white shadow transition-all flex items-center gap-1.5 font-clean">
                <i class="fa-regular fa-circle text-sm"></i> <span id="btn-label-circular">Circular</span>
            </button>
            <button data-device-target="square" class="px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-200 transition-all flex items-center gap-1.5 font-clean">
                <i class="fa-regular fa-square text-sm"></i> <span id="btn-label-square">Apple Watch</span>
            </button>
            <button data-device-target="band" class="px-3 py-1.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-200 transition-all flex items-center gap-1.5 font-clean">
                <i class="fa-solid fa-capsules text-sm"></i> <span id="btn-label-band">Xiaomi Band</span>
            </button>
        </div>

        <div class="h-4 w-px bg-slate-300 hidden sm:block"></div>

        <!-- Interruptores Tema/Idioma -->
        <div class="flex items-center gap-2">
            <!-- Botón Tema -->
            <button id="theme-toggle-btn" title="Cambiar Tema" class="p-1.5 px-2.5 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all flex items-center gap-1.5 font-clean border border-slate-200">
                <i id="theme-icon" class="fa-solid fa-moon text-slate-600"></i>
            </button>

            <!-- Botón Idioma -->
            <button id="lang-toggle-btn" title="Cambiar Idioma" class="p-1.5 px-2.5 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all flex items-center gap-1 font-clean border border-slate-200">
                <i class="fa-solid fa-globe text-cyan-500"></i>
                <span id="lang-text">ES</span>
            </button>
        </div>

    </header>

    <!-- Contenedor principal con animación de flotado -->
    <main class="relative flex flex-col items-center watch-container-animate">
        
        <!-- Correa superior -->
        <div id="watch-strap-top" class="watch-strap-top device-circular h-16 bg-gradient-to-b from-slate-300 to-slate-200 rounded-t-2xl border-t border-x border-slate-300/60 shadow-inner flex justify-center pt-2 transition-all duration-300">
            <div class="w-12 h-1 bg-slate-300/80 rounded-full"></div>
        </div>

        <!-- Marco reloj -->
        <div id="watch-frame" class="watch-frame device-circular relative bg-gradient-to-br from-slate-100 via-slate-200 to-slate-300 p-4 border-4 border-slate-200/80 flex items-center justify-center">
            
            <!-- Botones laterales -->
            <div id="watch-crown" class="absolute -right-3 top-1/2 -translate-y-1/2 w-3 h-10 bg-slate-300 rounded-r border border-slate-400/50 shadow"></div>
            <div id="watch-side-btn" class="absolute -right-2 top-1/3 w-2 h-6 bg-slate-300 rounded-r border border-slate-400/50 shadow"></div>

            <!-- Pantalla watchface -->
            <div class="watch-screen relative w-full h-full bg-slate-50 overflow-hidden border border-slate-200 shadow-inner flex flex-col items-center justify-between p-4 text-cyan-600 transition-colors duration-300">
                
                <!-- Lienzo 3D -->
                <div id="avatar-canvas-container" class="absolute inset-0 w-full h-full z-0 flex items-center justify-center"></div>

                <!-- Botones Flotantes Ajuste Escala y Animación (Aparecen al pasar el cursor) -->
                <div class="scale-controls-container absolute right-2.5 top-1/2 -translate-y-1/2 z-30 flex flex-col gap-1.5">
                    <button onclick="window.zoomAvatar(0.1)" title="Aumentar tamaño" class="scale-btn w-6 h-6 rounded-full bg-white/80 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700 shadow text-slate-700 dark:text-slate-200 flex items-center justify-center text-[10px] font-bold hover:bg-cyan-500 hover:text-white transition-all active:scale-90">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                    <button onclick="window.zoomAvatar(-0.1)" title="Reducir tamaño" class="scale-btn w-6 h-6 rounded-full bg-white/80 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700 shadow text-slate-700 dark:text-slate-200 flex items-center justify-center text-[10px] font-bold hover:bg-cyan-500 hover:text-white transition-all active:scale-90">
                        <i class="fa-solid fa-minus"></i>
                    </button>
                    <button id="anim-toggle-btn" onclick="window.toggleAvatarAnimation()" title="Pausar / Reproducir animación" class="hidden scale-btn w-6 h-6 rounded-full bg-white/80 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700 shadow text-slate-700 dark:text-slate-200 flex items-center justify-center text-[10px] font-bold hover:bg-cyan-500 hover:text-white transition-all active:scale-90">
                        <i id="anim-icon" class="fa-solid fa-pause"></i>
                    </button>
                </div>

                <!-- Modulo superior -->
                <div class="z-20 flex flex-col items-center gap-0.5 mt-2 pointer-events-none">
                    <div class="glass-card flex items-center gap-2 text-[10px] text-slate-600 font-bold bg-white/80 px-3 py-0.5 rounded-full backdrop-blur-md shadow-sm border border-slate-200/60 font-clean transition-colors duration-300">
                        <span><i class="fa-regular fa-calendar text-cyan-500 mr-1"></i><span id="watch-date">LUN, 24 OCT</span></span>
                        <span>•</span>
                        <div id="step-container" class="flex items-center gap-1">
                            <i class="fa-solid fa-person-walking text-cyan-500"></i>
                            <span id="watch-steps" class="font-bold text-slate-800">1,259</span>
                            <span id="steps-label" class="text-[9px] text-slate-500">PASOS</span>
                        </div>
                    </div>

                    <!-- Hora digital -->
                    <div class="time-display-box mt-1 px-4 py-0.5 rounded-2xl bg-white/75 backdrop-blur-md border border-white/60 shadow-md flex items-baseline gap-1 transition-colors duration-300">
                        <span id="watch-time" class="text-3xl sm:text-4xl font-bold text-slate-900 font-clock tracking-tight">08:27</span>
                        <span id="watch-ampm" class="text-xs font-bold text-cyan-600 font-clock">AM</span>
                    </div>
                </div>

                <!-- Modulo inferior -->
                <div class="z-20 flex flex-col items-center gap-1 w-full mb-1">
                    
                    <!-- Estado bateria -->
                    <div class="glass-card flex items-center justify-center text-[10px] text-slate-700 font-bold bg-white/80 px-2.5 py-0.5 rounded-full backdrop-blur-md shadow-sm border border-slate-200/60 font-clean transition-colors duration-300">
                        <span><i class="fa-solid fa-battery-three-quarters text-emerald-500 mr-1"></i><span id="watch-battery">85%</span></span>
                    </div>

                    <!-- Boton subida -->
                    <div id="upload-btn-wrapper" class="w-full flex justify-center">
                        <label title="Cargar o cambiar modelo .GLB" class="curved-btn bg-cyan-500 hover:bg-cyan-600 active:scale-98 text-white font-bold cursor-pointer flex items-center justify-center gap-1.5 border border-cyan-300/50">
                            <i class="fa-solid fa-box-archive text-xs"></i>
                            <span id="upload-btn-text" class="text-[10px] tracking-wider uppercase font-clean">Cargar Avatar .GLB</span>
                            <input type="file" id="glb-input" accept=".glb,.gltf" class="hidden">
                        </label>
                    </div>

                </div>

            </div>
        </div>

        <!-- Correa inferior -->
        <div id="watch-strap-bottom" class="watch-strap-bottom device-circular h-16 bg-gradient-to-t from-slate-300 to-slate-200 rounded-b-2xl border-b border-x border-slate-300/60 shadow-inner flex justify-center pb-2 transition-all duration-300">
            <div class="w-12 h-1 bg-slate-300/80 rounded-full self-end"></div>
        </div>
    </main>

    <!-- Librerias 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <!-- Scripts aplicacion -->
    <script src="js/gyroscope.js"></script>
    <script src="js/pedometer.js"></script>
    <script src="js/avatar3d.js"></script>
    <script src="js/deviceSelector.js"></script>
    <script src="js/themeAndLang.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
